apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: {{ .Values.keycloak.instanceCount }}
  http:
    httpEnabled: {{ .Values.keycloak.httpEnabled }}
    # tlsSecret: example-tls-secret  # For HTTPS, but gateway and mTLS handles this
  hostname:
    hostname: {{ .Values.keycloak.hostname }}
    # Only allow internal access (or port-forward).
    # Internal access is needed since the OpenTofu configuration is applied from inside.
    admin: "keycloak-service.keycloak.svc.cluster.local"
  bootstrapAdmin:
    service:
      secret: {{ .Values.keycloak.bootstrap.admin.service }}
    user:
      secret: {{ .Values.keycloak.bootstrap.admin.user }}
  db:
    database: "keycloak"
    host: "postgres"
    vendor: "postgres"
    usernameSecret:
      name: keycloak-database-secret
      key: username
    passwordSecret:
      name: keycloak-database-secret
      key: password
  proxy:
    headers: "xforwarded"
  httpManagement:
    port: 9000


